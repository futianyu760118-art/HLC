services:
  backend:
    environment:
      PORT: 18888
      FRONTEND_URL: ${PREVIEW_FRONTEND_URL:-http://localhost:18280}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-platform@example.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?请先在 .env 设置 PLATFORM_ADMIN_PASSWORD}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-平台管理员}
    volumes: !override
      - ./outputs/saas-docker-preview/uploads:/app/uploads

  nginx:
    ports: !override
      - "${PREVIEW_NGINX_PORT:-18280}:80"
      - "${PREVIEW_NGINX_HTTPS_PORT:-18445}:443"
    volumes: !override
      - ./outputs/saas-docker-preview/dist-prod:/usr/share/nginx/html:ro
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
