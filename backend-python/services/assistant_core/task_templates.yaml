  # 16. 反馈分类汇总
  - id: feedback_triage_summary
    name: 反馈分类汇总
    description: 缺陷/需求/其他统计、待处理反馈。
    trigger_examples:
      - 最近的 bug 反馈
      - 待处理的反馈
