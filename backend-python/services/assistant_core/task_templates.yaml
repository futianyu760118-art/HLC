    risk_level: low
    candidate_skills: [feedback_triage]
    workflow:
      - id: analyze
        type: skill
        skill: feedback_triage
        input_map: { feedback_type: entities.feedback_type, status: entities.status }
        output_key: result
        required: true
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.result }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [metric_cards, doughnut_chart]
    fallback_task: null

  # 17. HR 文案草稿
  - id: hr_draft_generation
    name: HR 文案草稿
    description: 生成面试邀请/Offer/通知/审批意见等草稿，不发送。
    trigger_examples:
      - 帮我写一封面试邀请
      - 写一份 Offer 通知
      - 帮我写入职通知
      - 生成审批意见
    keywords: [写一封, 帮我写, 草稿, 通知, 邀请, 邮件]
    required_entities: []
    optional_entities:
      draft_type: interview_invite
      keyword: null
    allowed_roles: [admin, hr_admin, recruiter, manager, executive]
    risk_level: low
    candidate_skills: [draft_generator, employee_search, recruitment_search]
    workflow:
      - id: facts
        type: skill
        skill: global_search
        input_map: { keyword: entities.keyword, limit: "static:5" }
        output_key: facts
        required: false
        on_error: continue
      - id: draft
        type: skill
        skill: draft_generator
        input_map:
          draft_type: entities.draft_type
          facts: state.facts
          tone: "static:正式"
        output_key: draft
        required: true
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: polish
        input_map: { facts: state.draft }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [warning]
    fallback_task: global_search_answer

  # 18. 系统总览
  - id: system_dashboard
    name: 系统总览
    description: 整体系统概览。
    trigger_examples:
      - 系统概览
      - 总览
