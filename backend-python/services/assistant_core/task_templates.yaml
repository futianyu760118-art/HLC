# HRM AI 助手任务模板。
# 增加新业务能力时优先在这里加 task，复用现有 skills，避免新增 Python 代码。

tasks:

  # 0. 兜底
  - id: global_search_answer
    name: 全局搜索
    description: 兜底任务，关键字模糊或无法确定模块时使用。
    trigger_examples:
      - 帮我查一下张三
      - 找一下最近的面试
      - 系统里有没有这个人
      - 查一下销售岗位
    keywords: []
    required_entities: [keyword]
    optional_entities:
      limit: 10
    allowed_roles: [admin, hr_admin, recruiter, manager, employee, finance, executive, viewer]
    risk_level: low
    candidate_skills: [global_search]
    workflow:
      - id: search
        type: skill
        skill: global_search
        input_map: { keyword: entities.keyword, limit: entities.limit }
        output_key: result
        required: true
        on_error: continue
        description: 跨模块全局搜索
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.result }
        output_key: summary
        required: false
        on_error: continue
        description: 中文总结
    output_widgets: [entity_cards]
    fallback_task: null

  # 1. 招聘整体概览
  - id: recruitment_overview
    name: 招聘整体概览
    description: 招聘整体概览，包含岗位、候选人、简历、面试。
    trigger_examples:
      - 招聘情况怎么样
      - 最近招聘进展
      - 本周招聘报表
      - 招聘概览
    keywords: [招聘, 招聘情况, 招聘进展, 招聘报表, 招聘概览]
    required_entities: []
    optional_entities:
      recent_days: 7
    allowed_roles: [admin, hr_admin, recruiter, executive, viewer, manager]
    risk_level: low
    candidate_skills: [dashboard_report, recruitment_search, resume_analysis]
    workflow:
      - id: dashboard
        type: skill
        skill: dashboard_report
        input_map: { scope: "static:recruitment" }
        output_key: dashboard
        required: true
        on_error: continue
        description: 招聘概览指标卡
      - id: resume_brief
        type: skill
        skill: resume_analysis
        input_map: { recent_days: entities.recent_days }
        output_key: resume_brief
        required: false
        on_error: continue
        description: 最近简历分析
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.dashboard, extra: state.resume_brief }
        output_key: summary
        required: false
        on_error: continue
        description: 招聘报表中文总结
    output_widgets: [metric_cards, bar_chart, doughnut_chart, data_table]
    fallback_task: global_search_answer

  # 2. 最近简历分析
  - id: recent_resume_analysis
    name: 最近简历分析
    description: 分析最近收到的简历、推荐高分候选人。
    trigger_examples:
      - 分析最近收到的简历
      - 最近 7 天有哪些好简历
      - 推荐几个值得面试的候选人
      - 最近简历评分最高的有谁
    keywords: [简历, 候选人, 评分, 推荐, 面试候选]
    required_entities: []
    optional_entities:
      recent_days: 7
      top_n: 10
      job_id: null
      keyword: null
    allowed_roles: [admin, hr_admin, recruiter, executive, viewer]
    risk_level: low
    candidate_skills: [resume_analysis, recruitment_search]
    workflow:
      - id: analyze
        type: skill
        skill: resume_analysis
        input_map:
          recent_days: entities.recent_days
          job_id: entities.job_id
          top_n: entities.top_n
          keyword: entities.keyword
        output_key: analysis
        required: true
        on_error: fallback
        description: 简历分析
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.analysis }
        output_key: summary
        required: false
        on_error: continue
        description: 中文总结
    output_widgets: [metric_cards, bar_chart, doughnut_chart, data_table]
    fallback_task: global_search_answer

  # 3. 面试计划
  - id: interview_schedule_plan
    name: 面试计划
    description: 推荐面试候选人并生成时段建议，不创建面试。
    trigger_examples:
      - 做一个面试计划
      - 安排一下面试
      - 谁该面试
      - 推荐面试候选人
    keywords: [面试计划, 面试安排, 排面试, 面试推荐]
    required_entities: []
    optional_entities:
      recent_days: 7
      top_n: 10
      job_id: null
    allowed_roles: [admin, hr_admin, recruiter, executive]
    risk_level: medium
    candidate_skills: [resume_analysis, interview_planning, draft_generator]
    workflow:
      - id: plan
        type: skill
        skill: interview_planning
        input_map:
          job_id: entities.job_id
          top_n: entities.top_n
        output_key: plan
        required: true
        on_error: fallback
        description: 生成面试计划
      - id: draft
        type: skill
        skill: draft_generator
        input_map:
          draft_type: "static:interview_plan"
          facts: state.plan
          tone: "static:正式"
        output_key: draft
        required: false
        on_error: continue
        description: 生成计划话术
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.plan }
        output_key: summary
        required: false
        on_error: continue
        description: 总结面试计划
    output_widgets: [metric_cards, data_table, warning]
    fallback_task: recent_resume_analysis

  # 4. 候选人比较
  - id: candidate_compare
    name: 候选人比较
    description: 比较多个候选人或简历评分。
    trigger_examples:
      - 张三和李四谁更适合销售岗位
      - 比较这两个候选人
    keywords: [比较, 谁更, 谁更适合, 哪个更]
    required_entities: [keyword]
    optional_entities: {}
    allowed_roles: [admin, hr_admin, recruiter, executive]
    risk_level: low
    candidate_skills: [recruitment_search, resume_analysis]
    workflow:
      - id: search
        type: skill
        skill: recruitment_search
        input_map: { keyword: entities.keyword, module: "static:candidates" }
        output_key: candidates
        required: true
        on_error: continue
      - id: resume
        type: skill
        skill: recruitment_search
        input_map: { keyword: entities.keyword, module: "static:resumes" }
        output_key: resumes
        required: false
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: comparison
        input_map: { facts: state.candidates, resumes: state.resumes }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [data_table]
    fallback_task: global_search_answer

  # 5. 岗位匹配分析
  - id: job_fit_analysis
    name: 岗位匹配分析
    description: 分析候选人与岗位的匹配度。
    trigger_examples:
      - 分析张三和销售岗位的匹配度
      - 这个候选人适合做经理吗
    keywords: [匹配度, 适合, 胜任]
    required_entities: [keyword]
    optional_entities:
      job_id: null
    allowed_roles: [admin, hr_admin, recruiter, executive]
    risk_level: low
    candidate_skills: [recruitment_search, resume_analysis]
    workflow:
      - id: search
        type: skill
        skill: recruitment_search
        input_map: { keyword: entities.keyword, module: "static:all" }
        output_key: search
        required: true
        on_error: continue
      - id: analyze
        type: skill
        skill: resume_analysis
        input_map: { job_id: entities.job_id, recent_days: "static:30", top_n: "static:5" }
        output_key: analysis
        required: false
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.search, analysis: state.analysis }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [data_table, entity_cards]
    fallback_task: global_search_answer

  # 6. 员工查询
  - id: employee_lookup
    name: 员工查询
    description: 查询员工的基本信息。
    trigger_examples:
      - 张三在哪个部门
      - 李四的入职时间
      - 王五是什么岗位
    keywords: [员工, 在哪个部门, 入职, 试用期, 转正]
    required_entities: [keyword]
    optional_entities:
      department_id: null
      status: null
    allowed_roles: [admin, hr_admin, manager, executive, viewer, recruiter, employee, finance]
    risk_level: low
    candidate_skills: [employee_search, organization_search]
    workflow:
      - id: search
        type: skill
        skill: employee_search
        input_map: { keyword: entities.keyword, department_id: entities.department_id, status: entities.status }
        output_key: result
        required: true
        on_error: fallback
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.result }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [entity_cards, data_table]
    fallback_task: global_search_answer

  # 7. 组织架构概览
  - id: organization_overview
    name: 组织架构概览
    description: 部门结构、部门人数、岗位体系。
    trigger_examples:
      - 公司组织架构怎么样
      - 销售部有哪些人
      - 部门人数分布
    keywords: [组织架构, 部门, 部门人数, 岗位体系]
    required_entities: []
    optional_entities:
      keyword: null
    allowed_roles: [admin, hr_admin, manager, executive, recruiter, viewer, employee, finance]
    risk_level: low
    candidate_skills: [organization_search, employee_search, dashboard_report]
    workflow:
      - id: org
        type: skill
        skill: organization_search
        input_map: { keyword: entities.keyword, include_stats: "static:true" }
        output_key: org
        required: true
        on_error: continue
      - id: dashboard
        type: skill
        skill: dashboard_report
        input_map: { scope: "static:employee" }
        output_key: dashboard
        required: false
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.org, dashboard: state.dashboard }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [metric_cards, bar_chart, entity_cards]
    fallback_task: global_search_answer

  # 8. 入职进度
  - id: onboarding_progress_check
    name: 入职进度检查
    description: 查询新员工入职任务进度。
    trigger_examples:
      - 新员工入职进度
      - 入职任务完成情况
    keywords: [入职进度, 入职任务, 入职清单, 新员工入职]
    required_entities: []
    optional_entities:
      keyword: null
    allowed_roles: [admin, hr_admin, manager, executive]
    risk_level: low
    candidate_skills: [employee_search]
    workflow:
      - id: emp
        type: skill
        skill: employee_search
        input_map: { keyword: entities.keyword, status: "static:pending_onboard" }
        output_key: emp
        required: true
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.emp }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [entity_cards, data_table]
    fallback_task: employee_lookup

  # 9. 试用期/转正
  - id: probation_review_summary
    name: 试用期/转正汇总
    description: 试用期到期员工、待转正、转正审批。
    trigger_examples:
      - 试用期员工
      - 谁快到转正
      - 转正审批
    keywords: [试用期, 转正]
    required_entities: []
    optional_entities: {}
    allowed_roles: [admin, hr_admin, manager, executive]
    risk_level: low
    candidate_skills: [employee_search, approval_search]
    workflow:
      - id: emp
        type: skill
        skill: employee_search
        input_map: { status: "static:probation" }
        output_key: probation_emp
        required: true
        on_error: continue
      - id: appr
        type: skill
        skill: approval_search
        input_map: { view: "static:pending", business_type: "static:probation" }
        output_key: appr
        required: false
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.probation_emp, approvals: state.appr }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [entity_cards, data_table]
    fallback_task: employee_lookup

  # 10. 离职原因汇总
  - id: resignation_reason_summary
    name: 离职原因汇总
    description: 离职趋势、待办交接、原因分类。
    trigger_examples:
      - 最近离职原因
      - 离职趋势
      - 谁要离职
    keywords: [离职, 辞职, 离职率]
    required_entities: []
    optional_entities: {}
    allowed_roles: [admin, hr_admin, executive]
    risk_level: low
    candidate_skills: [employee_search, dashboard_report]
    workflow:
      - id: emp
        type: skill
        skill: employee_search
        input_map: { status: "static:resigned" }
        output_key: emp
        required: true
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.emp }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [data_table, entity_cards]
    fallback_task: global_search_answer

  # 11. 考勤异常分析
  - id: attendance_exception_analysis
    name: 考勤异常分析
    description: 考勤异常、迟到、缺卡、加班、请假统计。
    trigger_examples:
      - 本月谁考勤异常最多
      - 迟到情况
      - 销售部本月考勤
    keywords: [考勤, 迟到, 缺卡, 早退, 请假, 加班, 出差, 补卡]
    required_entities: []
    optional_entities:
      month: null
      department_id: null
      anomaly_only: false
    allowed_roles: [admin, hr_admin, executive, manager, employee]
    risk_level: low
    candidate_skills: [attendance_analysis, employee_search]
    workflow:
      - id: analyze
        type: skill
        skill: attendance_analysis
        input_map:
          month: entities.month
          department_id: entities.department_id
          anomaly_only: entities.anomaly_only
        output_key: result
        required: true
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.result }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [metric_cards, doughnut_chart, data_table]
    fallback_task: global_search_answer

  # 12. 待审批汇总
  - id: approval_pending_summary
    name: 待审批汇总
    description: 我有哪些待审批/我的申请/审批历史。
    trigger_examples:
      - 我有哪些待审批
      - 我的申请
      - 待我审批
    keywords: [待审批, 待我审批, 我的申请, 审批记录]
    required_entities: []
    optional_entities:
      view: pending
    allowed_roles: [admin, hr_admin, manager, employee, recruiter, finance, executive]
    risk_level: low
    candidate_skills: [approval_search]
    workflow:
      - id: list
        type: skill
        skill: approval_search
        input_map: { view: entities.view }
        output_key: list
        required: true
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.list }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [data_table, warning]
    fallback_task: null

  # 13. 绩效分布
  - id: performance_distribution_report
    name: 绩效分布
    description: 绩效周期、评分分布、等级分布。
    trigger_examples:
      - 销售部绩效分布
      - 看一下绩效情况
      - 本期绩效报表
    keywords: [绩效, 评分, 等级, 考核]
    required_entities: []
    optional_entities:
      cycle_id: null
      department_id: null
    allowed_roles: [admin, hr_admin, executive, manager, employee]
    risk_level: low
    candidate_skills: [performance_analysis, employee_search]
    workflow:
      - id: analyze
        type: skill
        skill: performance_analysis
        input_map:
          cycle_id: entities.cycle_id
          department_id: entities.department_id
        output_key: result
        required: true
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.result }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [metric_cards, bar_chart, doughnut_chart]
    fallback_task: global_search_answer

  # 14. 月度薪酬汇总（高敏感）
  - id: payroll_month_summary
    name: 月度薪酬汇总
    description: 月度薪酬汇总、工资条、薪资档案。仅授权角色可用。
    trigger_examples:
      - 本月工资条
      - 这个月薪酬汇总
      - 工资发了多少
    keywords: [工资, 工资条, 薪资, 薪酬, 个税, 社保]
    required_entities: []
    optional_entities:
      month: null
      employee_id: null
    allowed_roles: [admin, hr_admin, finance, executive]
    risk_level: high
    requires_confirmation: false
    candidate_skills: [payroll_analysis]
    workflow:
      - id: analyze
        type: skill
        skill: payroll_analysis
        input_map:
          month: entities.month
          employee_id: entities.employee_id
        output_key: result
        required: true
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.result }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [metric_cards, warning, data_table]
    fallback_task: null

  # 15. 培训完成率
  - id: training_completion_report
    name: 培训完成率
    description: 培训计划完成率、出勤、成绩反馈。
    trigger_examples:
      - 培训完成率怎么样
      - 培训情况汇总
      - 谁还没完成培训
    keywords: [培训, 课程, 培训计划, 培训完成]
    required_entities: []
    optional_entities:
      department_id: null
    allowed_roles: [admin, hr_admin, executive, manager, employee]
    risk_level: low
    candidate_skills: [training_analysis, employee_search]
    workflow:
      - id: analyze
        type: skill
        skill: training_analysis
        input_map: { department_id: entities.department_id }
        output_key: result
        required: true
        on_error: continue
      - id: summarize
        type: llm
        llm_purpose: summarizer
        input_map: { facts: state.result }
        output_key: summary
        required: false
        on_error: continue
    output_widgets: [metric_cards, doughnut_chart]
