services:
  backend:
    image: ${HPT_BACKEND_IMAGE:?HPT_BACKEND_IMAGE is required}
    volumes: !override
      - ${HPT_SHARED_ROOT:?HPT_SHARED_ROOT is required}/uploads:/app/uploads

  nginx:
    volumes: !override
      - ./dist-prod:/usr/share/nginx/html:ro
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HPT_SHARED_ROOT:?HPT_SHARED_ROOT is required}/certs:/etc/nginx/certs:ro
