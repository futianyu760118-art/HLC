# =====================================================================
# 恒聘通 Nginx 配置
# - 前端静态资源（带哈希长缓存 / index.html 不缓存）
# - /api 与 /uploads 反代到后端容器
# - 安全响应头基线（CSP/HSTS/Frame Options 等）
# =====================================================================

# 隐藏 Nginx 版本
server_tokens off;

# 限速桶：登录接口防暴力破解，全局接口保护后端
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;

# 透传前端生成的请求 ID，便于浏览器请求、后端日志、AI 调用审计三方对齐。
map $http_x_request_id $proxy_request_id {
    default $http_x_request_id;
    "" $request_id;
}

server {
    listen 80;
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ----- 安全响应头（生产基线） -----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    # CSP：Tailwind 与 Chart.js 需要 'unsafe-inline'，FontAwesome 需要字体白名单，Rive 需要 blob: 和 wasm
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS：已启用 HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 上传文件大小限制（培训视频可达数百 MB）
    client_max_body_size 500M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/x-javascript
               application/xml application/xml+rss application/json
               image/svg+xml;

    # ----- 前端入口（不缓存，确保新版本能生效） -----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # ----- 带哈希的静态资源 — 长期不可变缓存 -----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ----- 其他静态资源 -----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ----- SPA 路由兜底 -----
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # ----- 登录接口：限速防暴力破解 -----
    location = /api/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:18888;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $proxy_request_id;
    }

    # ----- 门户 GET 请求：客户端短时缓存（30秒），减少重复 DB 查询 -----
    # 仅对 GET 生效，POST/PUT/DELETE 不缓存。private = 每用户独立（不共享）
    location ~ ^/api/portal/(courses|exams|learning-paths|notifications|pk-seasons|rewards)$ {
        limit_req zone=api_zone burst=120 nodelay;
        proxy_pass http://backend:18888;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $proxy_request_id;
        # 仅 GET 加缓存头
        set $cache_max_age 0;
        if ($request_method = GET) { set $cache_max_age "private, max-age=30"; }
        add_header Cache-Control $cache_max_age always;
    }

    # ----- API 反代 -----
    location /api/ {
        limit_req zone=api_zone burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:18888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $proxy_request_id;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;

        # AI 分析较慢，给足超时
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ----- 上传文件下载（仅 GET） -----
    # 使用 ^~ 前缀匹配跳过下面的正则匹配，否则 /uploads/xxx.jpg 会被静态资源规则吃掉
    location ^~ /uploads/ {
        proxy_pass http://backend:18888;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ----- 受保护文件接口（/api/files/...）-----
    # 同样用 ^~ 前缀匹配，避免 .png/.jpg 等后缀被上面的静态资源正则截获导致 404。
    # 典型场景：证书图片 /api/files/certificates/xxx.png 必须反代到后端鉴权读取。
    location ^~ /api/files/ {
        limit_req zone=api_zone burst=120 nodelay;
        proxy_pass http://backend:18888;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 隐藏敏感文件
    location ~ /\.(?!well-known) { deny all; }
    location ~ \.(env|git|sql|log|bak)$ { deny all; }
}
